<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#091a2f" />
    <meta name="description" content="Monitor JCF 24/7 — activa tu alerta y administra tu cuenta" />
    <title>JCF Monitor 24/7 · Activar VIP</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23091a2f'/%3E%3Cpath d='M12 34h9l5-13 10 25 6-17 4 5h6' fill='none' stroke='%233de2c4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --navy: #091a2f;
        --navy-2: #102844;
        --ink: #14243a;
        --muted: #718096;
        --line: #e4eaf1;
        --bg: #f4f7fb;
        --card: #fff;
        --blue: #2367f5;
        --cyan: #27cbb3;
        --green: #1dad72;
        --amber: #f1a526;
        --red: #e4545e;
        --purple: #7357e8;
        --shadow: 0 12px 35px rgba(16, 40, 68, 0.08);
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 255px 1fr;
      }
      .sidebar {
        background: var(--navy);
        color: #d6e2ef;
        padding: 24px 16px;
        position: fixed;
        inset: 0 auto 0 0;
        width: 255px;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: #356184 #102844;
        z-index: 30;
      }
      .sidebar::-webkit-scrollbar {
        width: 8px;
      }
      .sidebar::-webkit-scrollbar-track {
        background: #102844;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: #356184;
        border-radius: 99px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 10px 28px;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(145deg, #276ff9, #34d5bc);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 22px rgba(35, 103, 245, 0.35);
      }
      .brand-mark svg {
        width: 25px;
      }
      .brand strong {
        display: block;
        color: #fff;
        font-size: 17px;
        line-height: 1.15;
      }
      .brand small {
        color: #8da4ba;
        font-size: 12px;
      }
      .nav-label {
        padding: 0 12px 8px;
        color: #69839e;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav-btn {
        border: 0;
        background: transparent;
        color: #9fb3c8;
        border-radius: 11px;
        padding: 11px 12px;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 11px;
        transition: 0.2s;
      }
      .nav-btn:hover {
        background: #102b49;
        color: #fff;
      }
      .nav-btn.active {
        background: #173858;
        color: #fff;
        box-shadow: inset 3px 0 #36dec4;
      }
      .nav-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }
      .nav-btn .badge-count {
        margin-left: auto;
        background: #ef5862;
        color: #fff;
        font-size: 11px;
        min-width: 21px;
        height: 21px;
        border-radius: 8px;
        display: grid;
        place-items: center;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .system-mini {
        background: #102b49;
        border: 1px solid #173e61;
        border-radius: 14px;
        padding: 13px;
        margin-bottom: 12px;
      }
      .system-mini-row {
        display: flex;
        justify-content: space-between;
        color: #9eb2c6;
        font-size: 12px;
        margin-top: 6px;
      }
      .system-mini strong {
        color: #fff;
      }
      .pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3de2c4;
        box-shadow: 0 0 0 5px rgba(61, 226, 196, 0.1);
        margin-right: 8px;
      }
      /* --- Mapa de México: colores por estado real y punto pulsante --- */
      .mx-estado {
        fill: #ffbb8a;
        stroke: #0a1220;
        stroke-width: 0.7;
        transition: fill 0.4s ease;
      }
      .mx-estado.abierto { fill: #02c851; }
      .mx-estado.meta { fill: #fe9416; }
      .mx-estado.cerrado { fill: #bf2300; }
      .mapa-wrap { position: relative; }
      .leyenda {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 10px;
        font-size: 12.5px;
        color: #61758a;
      }
      .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
      .leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
      .leyenda i.sindatos { background: #ffbb8a; }
      .leyenda i.abierto { background: #02c851; }
      .leyenda i.meta { background: #fe9416; }
      .leyenda i.cerrado { background: #bf2300; }
      /* Punto pulsante sobre tu estado, solo cuando está Abierto — el
         mismo efecto de "radar" que traía la primera versión del sitio. */
      .mapa-pulso {
        position: absolute;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .mapa-pulso .anillo {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #02c851;
        animation: mapa-ping 2.2s ease-out infinite;
      }
      .mapa-pulso .anillo:nth-child(2) { animation-delay: 0.7s; }
      .mapa-pulso .anillo:nth-child(3) { animation-delay: 1.4s; }
      .mapa-pulso .punto {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 9px;
        height: 9px;
        background: #02c851;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px 3px rgba(2, 200, 81, 0.6);
      }
      @keyframes mapa-ping {
        0% { transform: scale(0.2); opacity: 0; }
        15% { opacity: 1; }
        100% { transform: scale(1.8); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mapa-pulso .anillo { animation: none; opacity: 0.3; }
      }
      .main {
        grid-column: 2;
        min-width: 0;
      }
      .topbar {
        height: 78px;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(12px);
      }
      .page-title h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .page-title p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .live-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #27765f;
        background: #eafaf5;
        border: 1px solid #c8f1e5;
        border-radius: 99px;
        padding: 8px 12px;
        font-weight: 700;
        font-size: 13px;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        color: #607287;
        position: relative;
      }
      .icon-btn .dot {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #f04f5b;
        border: 2px solid #fff;
        border-radius: 50%;
        right: 8px;
        top: 7px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #dce7f4;
        color: #25415f;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .content {
        padding: 27px 30px 44px;
        max-width: 1580px;
        margin: 0 auto;
      }
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
        animation: in 0.25s ease;
      }
      @keyframes in {
        from {
          opacity: 0.3;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .action-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 12px;
      }
      .period {
        display: flex;
        background: #e9eef5;
        border-radius: 10px;
        padding: 3px;
      }
      .period button {
        border: 0;
        background: transparent;
        color: #718096;
        padding: 7px 13px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 13px;
      }
      .period button.active {
        background: #fff;
        color: #1d3552;
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
      }
      .btn {
        border: 0;
        border-radius: 11px;
        padding: 10px 15px;
        font-weight: 750;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 8px 18px rgba(35, 103, 245, 0.22);
      }
      .btn-soft {
        background: #eaf0ff;
        color: #235bd1;
      }
      .btn-outline {
        background: #fff;
        color: #29445f;
        border: 1px solid var(--line);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 17px;
        margin-bottom: 20px;
      }
      .stat {
        background: var(--card);
        border: 1px solid #e8edf3;
        border-radius: var(--radius);
        padding: 19px;
        box-shadow: 0 7px 20px rgba(20, 36, 58, 0.035);
        position: relative;
        overflow: hidden;
      }
      .stat-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .stat-icon {
        width: 39px;
        height: 39px;
        border-radius: 12px;
        display: grid;
        place-items: center;
      }
      .stat-icon svg {
        width: 20px;
      }
      .si-blue {
        background: #eaf0ff;
        color: var(--blue);
      }
      .si-green {
        background: #e8f8f1;
        color: var(--green);
      }
      .si-amber {
        background: #fff5df;
        color: var(--amber);
      }
      .si-purple {
        background: #f0edff;
        color: var(--purple);
      }
      .stat-label {
        color: #708096;
        font-weight: 650;
        font-size: 13px;
        margin-top: 13px;
      }
      .stat-value {
        font-size: 28px;
        font-weight: 820;
        letter-spacing: -0.03em;
        margin-top: 2px;
      }
      .delta {
        font-size: 12px;
        color: var(--green);
        font-weight: 750;
      }
      .delta.neutral {
        color: #8290a0;
      }
      .stat-line {
        position: absolute;
        height: 3px;
        bottom: 0;
        left: 0;
        width: 68%;
        background: var(--blue);
        border-radius: 0 4px 4px 0;
      }
      .grid-main {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(290px, 0.75fr);
        gap: 18px;
        margin-bottom: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid #e6ecf2;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card-head {
        padding: 19px 21px;
        border-bottom: 1px solid #edf1f5;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-head h2 {
        font-size: 16px;
        margin: 0;
      }
      .card-head p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .link-btn {
        border: 0;
        background: none;
        color: var(--blue);
        font-weight: 750;
        font-size: 13px;
      }
      .status-banner {
        padding: 20px 21px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 15px;
        align-items: center;
      }
      .big-status {
        width: 54px;
        height: 54px;
        border-radius: 17px;
        background: #e7f9f2;
        color: var(--green);
        display: grid;
        place-items: center;
      }
      .big-status svg {
        width: 27px;
      }
      .status-banner strong {
        display: block;
        font-size: 17px;
      }
      .status-banner p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .next-check {
        text-align: right;
      }
      .next-check span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .next-check strong {
        font-size: 18px;
      }
      .map-list {
        padding: 3px 21px 17px;
      }
      .location {
        display: grid;
        grid-template-columns: 1.2fr 0.85fr 0.7fr auto;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid #edf1f5;
      }
      .place strong {
        display: block;
      }
      .place small {
        color: var(--muted);
      }
      .status-pill,
      .plan-pill,
      .channel-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 99px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .status-pill:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .open {
        background: #e7f8f1;
        color: #178e5c;
      }
      .closed {
        background: #feecef;
        color: #c33f4b;
      }
      .goal {
        background: #fff4df;
        color: #bd7810;
      }
      .error {
        background: #edf1f5;
        color: #6d7e90;
      }
      .plan-free {
        background: #edf1f5;
        color: #55687c;
      }
      .plan-vip {
        background: #ece8ff;
        color: #6848dc;
      }
      .channel-telegram {
        background: #e8f4ff;
        color: #2580c2;
      }
      .channel-email {
        background: #f0edff;
        color: #6d55ca;
      }
      .channel-call {
        background: #e8f8f1;
        color: #16895a;
      }
      .health {
        padding: 23px;
      }
      .health-ring {
        width: 156px;
        height: 156px;
        margin: 7px auto 20px;
        border-radius: 50%;
        background: conic-gradient(var(--cyan) 0 84%, #e7edf3 84%);
        display: grid;
        place-items: center;
        position: relative;
      }
      .health-ring:before {
        content: "";
        width: 119px;
        height: 119px;
        background: #fff;
        border-radius: 50%;
        position: absolute;
      }
      .health-ring div {
        z-index: 1;
        text-align: center;
      }
      .health-ring strong {
        font-size: 29px;
        display: block;
      }
      .health-ring span {
        font-size: 12px;
        color: var(--muted);
      }
      .legend {
        display: grid;
        gap: 11px;
      }
      .legend-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
      }
      .legend-row span {
        color: var(--muted);
      }
      .legend-row strong:before {
        content: "";
        width: 8px;
        height: 8px;
        display: inline-block;
        border-radius: 50%;
        background: var(--cyan);
        margin-right: 7px;
      }
      .legend-row:nth-child(2) strong:before {
        background: var(--amber);
      }
      .legend-row:nth-child(3) strong:before {
        background: #cfd7e1;
      }
      .activity {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .timeline {
        padding: 11px 21px 18px;
      }
      .event {
        display: grid;
        grid-template-columns: 35px 1fr auto;
        gap: 11px;
        align-items: start;
        padding: 12px 0;
        border-bottom: 1px solid #edf1f5;
      }
      .event:last-child {
        border-bottom: 0;
      }
      .event-icon {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: #edf3ff;
        color: var(--blue);
      }
      .event p {
        margin: 0;
        font-size: 13px;
      }
      .event p strong {
        display: block;
        color: var(--ink);
      }
      .event time {
        color: #93a0ae;
        font-size: 12px;
        white-space: nowrap;
      }
      .conversion {
        padding: 20px 21px;
      }
      .bars {
        height: 155px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
        padding-top: 10px;
      }
      .bar-col {
        flex: 1;
        text-align: center;
        color: #8795a4;
        font-size: 11px;
      }
      .bar {
        border-radius: 7px 7px 2px 2px;
        background: linear-gradient(180deg, #3b7cff, #7ba7ff);
        margin-bottom: 6px;
        min-height: 12px;
      }
      .conversion-foot {
        display: flex;
        gap: 20px;
        margin-top: 13px;
      }
      .conversion-foot strong {
        font-size: 19px;
      }
      .conversion-foot span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .toolbar {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 15px;
      }
      .search {
        position: relative;
        flex: 1;
        min-width: 190px;
      }
      .search svg {
        position: absolute;
        left: 12px;
        top: 10px;
        width: 18px;
        color: #8b99a8;
      }
      .search input {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 12px 0 38px;
        outline: 0;
      }
      .search input:focus,
      .field input:focus,
      .field select:focus {
        border-color: #7ca5fb;
        box-shadow: 0 0 0 3px rgba(35, 103, 245, 0.1);
      }
      .select {
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: #4a5e73;
        padding: 0 32px 0 12px;
      }
      .table-card {
        overflow: hidden;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 780px;
      }
      th {
        text-align: left;
        padding: 12px 16px;
        background: #f8fafc;
        color: #7b8998;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      td {
        padding: 14px 16px;
        border-top: 1px solid #edf1f5;
        font-size: 13px;
      }
      tbody tr:hover {
        background: #fbfcfe;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .person-avatar {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: #e9eef7;
        color: #38526d;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 12px;
      }
      .person strong {
        display: block;
      }
      .person small {
        color: var(--muted);
      }
      .row-action {
        border: 0;
        background: #f0f3f7;
        width: 31px;
        height: 31px;
        border-radius: 9px;
        color: #607287;
      }
      .muted {
        color: var(--muted);
      }
      .tabs {
        display: flex;
        gap: 5px;
      }
      .tab-btn {
        border: 0;
        background: transparent;
        padding: 8px 12px;
        border-radius: 9px;
        color: #68798c;
        font-weight: 700;
      }
      .tab-btn.active {
        background: #eaf0ff;
        color: var(--blue);
      }
      .kanban {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .kanban-col {
        background: #edf2f7;
        border-radius: 16px;
        padding: 12px;
        min-height: 380px;
      }
      .kanban-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 3px 12px;
        font-weight: 800;
      }
      .kanban-title span {
        background: #fff;
        color: #6f7d8b;
        border-radius: 8px;
        padding: 2px 8px;
        font-size: 12px;

  <body>
<div class="full-stage">
<div class="customer-stage">
  <div class="customer-shell">
    <div class="customer-head">
      <div class="customer-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M3 17h5l3-8 6 16 4-11 3 3h5" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div><strong>JCF Monitor 24/7</strong><small>Tu monitoreo personal</small></div>
      </div>
    </div>
    <div class="customer-login" id="customerLogin" style="grid-template-columns:1fr;max-width:430px;margin:0 auto;">
      <article class="login-card">
        <div id="cargando">
          <h2>Preparando tu pago…</h2>
          <p>Un momento, estamos revisando los datos de tu cuenta.</p>
        </div>
        <div id="resultadoPago" class="oculto">
          <h2 id="resultadoPagoTitulo">—</h2>
          <p id="resultadoPagoTexto">—</p>
          <p style="text-align:center;margin-top:14px;"><a href="/panel.html" id="resultadoPagoLink" class="btn btn-primary" style="display:inline-block;text-decoration:none;">Ir a mi panel</a></p>
        </div>
        <div id="checkoutCard" class="oculto">
          <h2>Subir a VIP</h2>
          <p>Vas a activar VIP para <strong id="vipCheckoutLugar">—</strong> <span id="vipCheckoutTexto">—</span></p>
          <div class="field oculto" id="vipCheckoutTelefonoWrap">
            <label for="vipCheckoutTelefono">Teléfono (para la llamada VIP)</label>
            <div style="display:flex;gap:8px;">
              <select id="vipCheckoutPrefijo" style="flex:0 0 118px;">
                <option value="+52" selected>🇲🇽 +52</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+34">🇪🇸 +34</option>
                <option value="+502">🇬🇹 +502</option>
                <option value="+503">🇸🇻 +503</option>
                <option value="+504">🇭🇳 +504</option>
              </select>
              <input id="vipCheckoutTelefono" type="tel" inputmode="tel" maxlength="10" style="flex:1;" />
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%;margin-top:14px;" id="btnConfirmarVip">Pagar y activar VIP</button>
          <p style="text-align:center;margin-top:14px;"><a href="/panel.html" style="font-size:13px;color:var(--muted);text-decoration:none;">Cancelar y volver a mi panel</a></p>
          <div class="msg" id="vipCheckoutMsg" style="font-size:12.5px;margin-top:8px;min-height:15px;"></div>
        </div>

</footer>

<script>
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem('jcf_token') || '';
let CUENTA = null;

async function apiAuth(action, method='GET', body=null) {
  const resp = await fetch(`/.netlify/functions/customer-auth?action=${action}`, {
    method, headers: { 'Content-Type':'application/json', ...(TOKEN ? {Authorization:`Bearer ${TOKEN}`} : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || 'Error desconocido');
  return data;
}
function textoFrecuenciaVip(min){
  if (min % 60 === 0) { const h = min / 60; return h === 1 ? '1 hora' : `${h} horas`; }
  return `${min} minutos`;
}

// Si venimos de vuelta de MercadoPago, el webhook que activa el VIP es
// asíncrono — puede tardar unos segundos en llegar — así que aquí solo
// avisamos del resultado del pago, sin prometer que el panel ya está
// actualizado. Esto aplica tanto a quien ya tenía cuenta (traía sesión)
// como a quien acaba de comprar VIP sin haberse registrado antes — por
// eso se revisa ANTES que nada, sin exigir sesión.
const RESULTADOS_PAGO = {
  exitoso: { titulo: '¡Pago recibido!', texto: TOKEN ? 'En unos segundos tu cuenta pasa a VIP. Si tu panel todavía muestra Gratis, espera un momento y vuelve a entrar.' : 'En unos minutos recibirás un correo con tus datos de acceso — revisa también spam. Con eso ya puedes entrar a tu cuenta VIP.' },
  pendiente: { titulo: 'Pago en proceso', texto: 'Tu pago está pendiente de confirmación. En cuanto se acredite, tu cuenta pasará a VIP automáticamente.' },
  fallido: { titulo: 'El pago no se completó', texto: 'No se realizó el cargo. Puedes intentarlo de nuevo cuando quieras.' }
};
const resultadoPago = RESULTADOS_PAGO[new URLSearchParams(location.search).get('pago')];
if (resultadoPago) {
  $('cargando').classList.add('oculto');
  $('resultadoPagoTitulo').textContent = resultadoPago.titulo;
  $('resultadoPagoTexto').textContent = resultadoPago.texto;
  $('resultadoPagoLink').href = TOKEN ? '/panel.html' : '/entrar.html';
  $('resultadoPagoLink').textContent = TOKEN ? 'Ir a mi panel' : 'Entrar a mi cuenta';
  $('resultadoPago').classList.remove('oculto');
}

// Sin sesión y sin venir de un pago, no hay nada que subir a VIP
// directamente aquí — se manda a la página de registro con el plan VIP
// ya preseleccionado, para no pedirle dos veces los mismos datos.
if (!TOKEN && !resultadoPago) { location.href = '/?plan=vip'; }

async function cargarCheckout(){
  if (resultadoPago) return;
  const { suscriptor } = await apiAuth('me');
  CUENTA = suscriptor;
  if (CUENTA.plan === 'vip') { location.href = '/panel.html'; return; }

  let frecVip = 10;
  try { const r = await fetch('/.netlify/functions/config-publica'); frecVip = (await r.json()).vip_frecuencia_min || 10; } catch {}

  $('vipCheckoutLugar').textContent = `${CUENTA.municipio}, ${CUENTA.estado}`;
  $('vipCheckoutTexto').textContent = `— $100 MXN, revisión cada ${textoFrecuenciaVip(frecVip)}, correo y llamada, 14 días. Nada de tus demás datos cambia, solo se activa el plan.`;
  $('vipCheckoutTelefonoWrap').classList.toggle('oculto', !!CUENTA.phone);
  $('cargando').classList.add('oculto');
  $('checkoutCard').classList.remove('oculto');
}

$('btnConfirmarVip').addEventListener('click', async () => {
  const msg = $('vipCheckoutMsg'); msg.textContent = '';
  const necesitaTelefono = !$('vipCheckoutTelefonoWrap').classList.contains('oculto');
  const telefono = $('vipCheckoutTelefono').value.trim();
  if (necesitaTelefono && !/^\d{10}$/.test(telefono)) {
    msg.textContent = 'Escribe tu teléfono a 10 dígitos para la llamada VIP.'; return;
  }
  $('btnConfirmarVip').disabled = true;
  msg.textContent = 'Generando tu pago…';
  try {
    const resp = await fetch('/.netlify/functions/create-preference', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}` },
      body: JSON.stringify(necesitaTelefono ? { telefono, telefonoPrefijo: $('vipCheckoutPrefijo').value } : {})
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || 'No se pudo generar el pago');
    window.location.href = data.init_point;
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    $('btnConfirmarVip').disabled = false;
  }
});

if (TOKEN || resultadoPago) {
  cargarCheckout().catch(err => {
    console.error('No se pudo preparar el checkout VIP:', err);
    localStorage.removeItem('jcf_token');
    location.href = '/entrar.html';
  });
}
</script>
